# Self-hosted Meridian ERP:  docker compose up -d   (web :3000, API :4000, Postgres :5433)
name: meridian
services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: meridian, POSTGRES_PASSWORD: "${DB_PASSWORD:-meridian}", POSTGRES_DB: meridian }
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U meridian"], interval: 3s, retries: 20 }
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://meridian:${DB_PASSWORD:-meridian}@db:5432/meridian
      JWT_SECRET: "${JWT_SECRET:-dev-only-secret-change-me}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-meridian-demo}"
      COMPANY_MODE: "${COMPANY_MODE:-demo}"   # demo = sample company; empty = a real company that starts blank
      OWNER_EMAIL: "${OWNER_EMAIL:-}"
      OWNER_NAME: "${OWNER_NAME:-Owner}"
      OWNER_PASSWORD: "${OWNER_PASSWORD:-}"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
    ports: ["4000:4000"]
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "${PUBLIC_API_URL:-http://localhost:4000}" }
    depends_on: { api: { condition: service_healthy } }
    environment:
      API_URL: http://api:4000
      AI_EDITION: "${AI_EDITION:-demo}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GOOGLE_GENERATIVE_AI_API_KEY: "${GOOGLE_GENERATIVE_AI_API_KEY:-}"
    ports: ["3000:3000"]
    restart: unless-stopped
volumes:
  pgdata: {}
