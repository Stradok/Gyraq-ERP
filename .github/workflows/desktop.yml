name: Desktop installers
# Builds the Windows .exe, Linux AppImage/.deb and macOS .dmg on GitHub's machines (free), so nothing heavy runs on your PC.
# Run it from the Actions tab, or push a tag like v1.0.0. Download the files from the run's Artifacts.
on:
  workflow_dispatch:
  push: { tags: ["v*"] }
jobs:
  build:
    strategy:
      fail-fast: false      # one platform failing must not hide the others
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        flavor: [real, demo]   # demo = opens the public demo (fake seeded company); real = starts on the setup screen
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: "Demo flavor - bundle the demo address"
        if: matrix.flavor == 'demo'
        shell: bash
        run: |
          echo '{"url":"https://www.gyraq.com"}' > defaults.json
          node -e 'const p=require("./package.json");p.build.files.push("defaults.json");require("fs").writeFileSync("package.json",JSON.stringify(p,null,2))'
      - shell: bash   # PowerShell (the Windows default) mangles the quoted app-name option
        run: npx electron-builder --publish never ${{ matrix.flavor == 'demo' && '-c.productName="Meridian ERP Demo" -c.appId=com.gyraq.meridian.demo' || '' }}
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }   # unsigned until you buy a signing certificate (see docs/DEPLOY.md)
      - uses: actions/upload-artifact@v4
        with: { name: "meridian-${{ matrix.flavor }}-${{ matrix.os }}", path: "desktop/dist/*.*", if-no-files-found: error }
