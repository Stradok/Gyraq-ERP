name: Backend CI
on:
  push: { branches: [main], paths: ["backend/**", "frontend/src/lib/**"] }
  pull_request: { paths: ["backend/**", "frontend/src/lib/**"] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: meridian, POSTGRES_PASSWORD: meridian, POSTGRES_DB: meridian }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U meridian" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
