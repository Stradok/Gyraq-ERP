<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian ERP</title>
<style>body{font:16px system-ui;background:#0b0c0e;color:#e6e6e6;margin:0;min-height:100vh;display:grid;place-items:center}
form{width:min(26rem,90vw);display:grid;gap:.9rem}input,button{padding:.8rem;border-radius:10px;font:inherit}
input{border:1px solid #333;background:#16181c;color:inherit}button{border:0;background:#4f7cff;color:#fff;font-weight:600}
p{margin:0;color:#9a9a9a}#e{color:#ff7a7a;min-height:1.2em}</style></head>
<body><form id="f"><h1 style="margin:0;font-size:1.3rem">Meridian ERP</h1>
<p>Enter the address of your company's Meridian server. You will sign in with your own account.</p>
<input id="u" type="url" inputmode="url" placeholder="https://erp.yourcompany.com" autocomplete="off">
<label id="c" style="display:none;gap:.5rem;font-size:.9rem"><input id="ok" type="checkbox" style="width:auto"> <span id="ct"></span></label>
<button>Connect</button><p id="e"></p></form>
<script>
// Real build: remember the company's server address once, then open it. "?reset=1" (from the sign-in page's "Change server" link) clears it.
var KEY = "meridian-server", q = new URLSearchParams(location.search);
if (q.get("reset")) localStorage.removeItem(KEY);
// https only, no embedded user:password, no IP-address hosts. The person must confirm the exact host before it is saved.
function origin(v) { try { var x = new URL(v.trim()); return x.protocol === "https:" && !x.username && !x.password && !/^[\d.]+$|^\[/.test(x.hostname) ? x.origin : null; } catch (e) { return null; } }
var saved = origin(localStorage.getItem(KEY) || "");
if (saved) location.replace(saved + "/login");
document.getElementById("f").onsubmit = function (ev) { ev.preventDefault(); var o = origin(document.getElementById("u").value), e = document.getElementById("e");
  if (!o) { e.textContent = "Enter a company address such as https://erp.yourcompany.com"; return; }
  var c = document.getElementById("c"), ok = document.getElementById("ok");
  if (c.style.display === "none") { document.getElementById("ct").textContent = "I trust " + new URL(o).host + " and want to sign in there."; c.style.display = "flex"; e.textContent = "Check the address, tick the box, then press Connect."; return; }
  if (!ok.checked) { e.textContent = "Tick the box to confirm."; return; }
  localStorage.setItem(KEY, o); location.replace(o + "/login"); };
</script></body></html>
